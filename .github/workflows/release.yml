#
# Tag-driven release. Produces a verifiable, signed CAP file.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Artefacts attached to the GitHub Release:
#   - meowl-wallet.cap        the wallet CAP file
#   - meowl-wallet-sbom.cdx.json     CycloneDX 1.6 SBOM (wallet)
#   - meowl-ndef.cap          the NDEF tag CAP file
#   - meowl-ndef-sbom.cdx.json       CycloneDX 1.6 SBOM (NDEF)
#   - meowl-backup.cap        the backup CAP file
#   - meowl-backup-sbom.cdx.json     CycloneDX 1.6 SBOM (backup)
#   - sha256sums.txt          digests of every artefact
#
# The CAP file is also attested via Sigstore keyless signing
# (actions/attest-build-provenance). Verify with:
#
#   gh attestation verify meowl-wallet.cap --repo qntx/meowl-applet
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # Sigstore OIDC
      attestations: write # write attestation to the repo

    steps:
      - name: Checkout (with SDK submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Build + test + SBOM
        run: >
          ./gradlew
          :wallet:buildCap :ndef:buildCap :backup:buildCap
          :tests:test
          :wallet:cyclonedxDirectBom :ndef:cyclonedxDirectBom :backup:cyclonedxDirectBom

      - name: Stage release artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp wallet/build/cap/meowl-wallet.cap release/
          cp wallet/build/reports/meowl-wallet-sbom.cdx.json release/
          cp ndef/build/cap/meowl-ndef.cap release/
          cp ndef/build/reports/meowl-ndef-sbom.cdx.json release/
          cp backup/build/cap/meowl-backup.cap release/
          cp backup/build/reports/meowl-backup-sbom.cdx.json release/
          (cd release && sha256sum * > sha256sums.txt)

      - name: Attest SLSA build provenance
        continue-on-error: true # Only works for public repos on Team/Pro/Free plans
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/meowl-wallet.cap
            release/meowl-ndef.cap
            release/meowl-backup.cap

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/meowl-wallet.cap
            release/meowl-wallet-sbom.cdx.json
            release/meowl-ndef.cap
            release/meowl-ndef-sbom.cdx.json
            release/meowl-backup.cap
            release/meowl-backup-sbom.cdx.json
            release/sha256sums.txt
