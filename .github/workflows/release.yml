name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # gh release create
      id-token: write # attest-build-provenance OIDC subject identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-disabled: true # no cache poisoning of release artifacts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - name: Tag matches version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version tag=$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_NAME" == "v$version" || "$GITHUB_REF_NAME" == "v$version-"* ]]
      - name: Build and test
        run: ./gradlew build --no-build-cache
      - name: Vector generators agree
        run: spec/vectors/gen/check.sh
      - name: Distributables
        run: ./gradlew dist --no-build-cache
      - name: Reproducible CAP
        run: |
          ./gradlew :applet:cap --rerun-tasks --no-build-cache
          rebuilt=$(sha256sum applet/build/cap/qntx-card.cap | cut -d' ' -f1)
          released=$(grep '  qntx-card.cap$' build/dist/SHA256SUMS | cut -d' ' -f1)
          echo "rebuilt  $rebuilt"; echo "released $released"
          test "$rebuilt" = "$released"
      - name: Checksums
        run: cd build/dist && sha256sum -c SHA256SUMS
      - name: Release notes
        run: |
          cap=$(sha256sum build/dist/qntx-card.cap | cut -d' ' -f1)
          sim=$(sha256sum build/dist/card-sim.jar | cut -d' ' -f1)
          cat > build/release-notes.md <<EOF
          qntx card protocol 1 — wallet instance AID F0716E74780101 (spec/protocol.md §2, §17).

          Artifacts (checksums in SHA256SUMS, verify with \`sha256sum -c SHA256SUMS\`):
          - \`qntx-card.cap\` — the one CAP (package F0716E747800), SHA-256 \`$cap\`
          - \`card-sim.jar\` — the card simulator, SHA-256 \`$sim\`
          - \`vectors.zip\` — the spec/vectors test vectors with their licenses
          - \`qntx-card-<version>.zip\` — the qntx-card provisioning tool
          - \`qntx-card.cdx.json\` — CycloneDX SBOM of everything released

          Build provenance is attested; verify an artifact with:

              gh attestation verify <file> --repo $GITHUB_REPOSITORY

          card-sim.jar is a faithful simulator for qntx/wallet CI (pin this release tag and the
          SHA-256 above); it is not hardware evidence — see "Real-card suite" in the README.
          EOF
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/dist/card-sim.jar
            build/dist/qntx-card-*.zip
            build/dist/qntx-card.cap
            build/dist/qntx-card.cdx.json
            build/dist/vectors.zip
      - name: GitHub release
        run: |
          args=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file build/release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/dist/* "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
