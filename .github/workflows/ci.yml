name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE lint
        # the official image, pinned to the multi-arch index digest tag 6 resolved to
        # on 2026-11-25 (fsfe/reuse:6.3.0, pushed 2026-10-30); was fsfe/reuse-action@v6
        run: docker run --rm -v "$GITHUB_WORKSPACE:/data" fsfe/reuse:6.3.0@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6 lint
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Spotless
        run: ./gradlew spotlessCheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and test
        run: ./gradlew build --no-build-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - name: Differential (noble)
        run: |
          cd spec/vectors/gen/ts
          bun install --frozen-lockfile
          bun verify.ts ../../../../tests/build/differential/signatures.json
      - name: Reproducible CAP
        run: |
          first=$(sha256sum applet/build/cap/qntx-card.cap | cut -d' ' -f1)
          ./gradlew :applet:cap --rerun-tasks --no-build-cache
          second=$(sha256sum applet/build/cap/qntx-card.cap | cut -d' ' -f1)
          echo "first  $first"; echo "second $second"
          test "$first" = "$second"
          {
            echo "## CAP"
            echo "- qntx-card.cap: $(stat -c %s applet/build/cap/qntx-card.cap) B, sha256 \`$first\`"
            echo "- components: $(unzip -l applet/build/cap/qntx-card.cap 'org/qntx/card/javacard/*.cap' | tail -1 | awk '{print $1}') B"
            echo "## Transient memory"
            echo '```'
            cat tests/build/reports/memory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reproducible card-sim
        run: |
          first=$(sha256sum sim/build/libs/card-sim.jar | cut -d' ' -f1)
          ./gradlew :sim:shadowJar --rerun-tasks --no-build-cache
          second=$(sha256sum sim/build/libs/card-sim.jar | cut -d' ' -f1)
          echo "first  $first"; echo "second $second"
          test "$first" = "$second"
          echo "- card-sim.jar: $(stat -c %s sim/build/libs/card-sim.jar) B, sha256 \`$second\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Mutation tests
        run: ./gradlew :tests:pitest
      - name: SBOM
        run: ./gradlew cyclonedxBom
      - name: Distributables
        run: |
          ./gradlew dist
          cd build/dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build
          path: |
            applet/build/cap/qntx-card.cap
            applet/build/reports/qntx-card.cdx.json
            tests/build/differential/signatures.json
            tests/build/reports/
            sim/build/reports/
            build/dist/
          if-no-files-found: warn
          retention-days: 14

  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - name: Both generators agree
        run: spec/vectors/gen/check.sh
