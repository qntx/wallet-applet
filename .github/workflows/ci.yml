name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (with SDK submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Build CAPs (wallet + NDEF + backup)
        run: ./gradlew :wallet:buildCap :ndef:buildCap :backup:buildCap

      - name: Run tests
        run: ./gradlew :tests:test :tools:test

      - name: Upload wallet CAP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meowl-wallet-cap
          path: wallet/build/cap/meowl-wallet.cap
          if-no-files-found: error
          retention-days: 30

      - name: Upload NDEF CAP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meowl-ndef-cap
          path: ndef/build/cap/meowl-ndef.cap
          if-no-files-found: error
          retention-days: 30

      - name: Upload backup CAP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meowl-backup-cap
          path: backup/build/cap/meowl-backup.cap
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            tests/build/reports/tests/**
            tests/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
