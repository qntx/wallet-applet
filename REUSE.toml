version = 1

[[annotations]]
path = [
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    ".gitmodules",
    ".github/**",
    "gradle/**",
    "gradlew",
    "gradlew.bat",
    "**/*.gradle.kts",
    "gradle.properties",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 QuantX"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["spec/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 QuantX"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["realcard/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 QuantX"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["sim/jcardsim/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2011 Licel Corporation and jCardSim contributors"
