[versions]
jdk = "25"
javacard-sdk = "jc320v26.0_kit"
javacard-target = "3.0.5"
ant-javacard = "26.05.15"
bouncycastle = "1.87"
asm = "9.11.1"
junit = "6.1.3"
pit-core = "1.30.2"
pit-junit5 = "1.2.3"
google-java-format = "1.35.0"
ktlint = "1.8.0"
jackson-jr = "2.22.4"
gppro = "26.04.20.1"
apdu4j = "26.04.20.1"
slf4j = "2.0.20"
picocli = "4.7.7"

[libraries]
ant-javacard = { module = "com.github.martinpaljak:ant-javacard", version.ref = "ant-javacard" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-jr = { module = "com.fasterxml.jackson.jr:jackson-jr-objects", version.ref = "jackson-jr" }
gppro = { module = "com.github.martinpaljak:globalplatformpro", version.ref = "gppro" }
apdu4j-core = { module = "com.github.martinpaljak:apdu4j-core", version.ref = "apdu4j" }
apdu4j-pcsc = { module = "com.github.martinpaljak:apdu4j-pcsc", version.ref = "apdu4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.12.0" }
cyclonedx = { id = "org.cyclonedx.bom", version = "3.6.1" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
